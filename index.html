      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

      .app-shell {
        --bg: #14121A;
        --bg-elevated: #1B1723;
        --surface: #211C2C;
        --surface-2: #291F35;
        --border: #332C43;
        --accent: #E7A94C;
        --accent-soft: rgba(231,169,76,0.16);
        --accent2: #C1546B;
        --success: #7FA88D;
        --info: #7EA0C4;
        --violet: #B98BD1;
        --text: #F3EEE6;
        --muted: #A79CB8;
        --dim: #6F6580;

        background: radial-gradient(120% 140% at 15% -10%, #241C30 0%, var(--bg) 55%);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        min-height: 100%;
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .app-shell * { box-sizing: border-box; }
      .app-shell h1, .app-shell h2, .app-shell h3, .app-shell h4 {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.2px;
      }
      .app-shell code {
        font-family: 'JetBrains Mono', monospace;
        background: var(--surface-2);
        padding: 1px 6px;
        border-radius: 5px;
        font-size: 0.92em;
        color: var(--accent);
      }
      .app-shell :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .app-shell button { font-family: inherit; cursor: pointer; }
      .spin { animation: spin 0.9s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      /* ---------- top bar ---------- */
      .top-bar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(20,18,26,0.6);
        backdrop-filter: blur(6px);
      }
      .brand { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; color: var(--accent); }

      .save-error-banner {
        display: flex; align-items: center; gap: 8px;
        background: rgba(193,84,107,0.15); color: #E39BAA;
        font-size: 12.5px; padding: 8px 20px; border-bottom: 1px solid var(--border);
      }
      .save-error-banner .icon-btn { margin-left: auto; color: #E39BAA; }

      .app-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }

      /* ---------- role gate ---------- */
      .role-gate {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 48px 20px; gap: 10px; position: relative;
      }
      .role-gate h1 { font-size: 34px; margin-top: 18px; }
      .role-sub { color: var(--muted); font-size: 14.5px; margin: 0 0 20px; }
      .waveform {
        display: flex; align-items: flex-end; gap: 3px; height: 64px; width: min(520px, 90%);
        opacity: 0.85;
      }
      .wave-bar {
        flex: 1; border-radius: 3px;
        background: linear-gradient(180deg, var(--accent), var(--accent2));
      }
      .waveform-live .wave-bar { animation: wavepulse 2.6s ease-in-out infinite; }
      @keyframes wavepulse {
        0%, 100% { transform: scaleY(0.75); opacity: 0.65; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .waveform-live .wave-bar { animation: none; }
        .spin { animation: none; }
      }
      .role-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
      .role-card {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        width: 220px; padding: 26px 18px; border-radius: 16px;
        background: var(--surface); border: 1px solid var(--border); color: var(--text);
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .role-card:hover { transform: translateY(-3px); border-color: var(--accent); background: var(--surface-2); }
      .role-card-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; margin-top: 4px; }
      .role-card-sub { font-size: 12.5px; color: var(--muted); }
      .role-card svg { color: var(--accent); }

      .passcode-box { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 8px; }
      .passcode-box svg { color: var(--accent); }

      /* ---------- inputs / buttons ---------- */
      .input {
        width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
        border-radius: 9px; padding: 9px 11px; font-size: 13.5px; font-family: inherit;
      }
      .input::placeholder { color: var(--dim); }
      .input-error { border-color: var(--accent2); }
      .textarea { resize: vertical; min-height: 64px; }
      .pin-big { text-align: center; letter-spacing: 6px; font-family: 'JetBrains Mono', monospace; font-size: 18px; width: 160px; }
      .pin-error { display: flex; align-items: center; gap: 6px; color: var(--accent2); font-size: 12.5px; margin: 0; }
      .pin-actions { display: flex; gap: 10px; margin-top: 4px; }

      .btn {
        display: inline-flex; align-items: center; gap: 7px; border: none; border-radius: 9px;
        padding: 9px 15px; font-size: 13.5px; font-weight: 600; transition: filter 0.15s ease, transform 0.1s ease;
      }
      .btn:active { transform: scale(0.97); }
      .btn-primary { background: linear-gradient(135deg, var(--accent), #D68F35); color: #1A1409; }
      .btn-primary:hover { filter: brightness(1.08); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
      .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
      .btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-sm { padding: 6px 11px; font-size: 12.5px; }
